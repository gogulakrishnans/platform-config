# gitops-root defaults. The root Application (installed by L1) layers:
#   values.yaml -> values-<group>.yaml -> ../generated/<group>/root.yaml (clusters, customers, hosts)

group: ""                       # devstage | uat | prod (generated)
computeProject: ""              # the group's compute project ID (generated)
repoURL: https://github.com/example-org/platform-config.git
targetRevision: main

clusters: []                    # generated from inventory/clusters (primary + DR)
customers: []                   # generated: customer -> [cluster, namespace] destinations
gatewayHosts: []                # generated: hosts the Istio ingress gateway accepts
egressHosts: []                 # generated: union of the catalog egress allowlists (host:port)

# Instance safety policy (overridden per group).
policy:
  # ApplicationSet policy: "sync" lets a generator delete Applications; "create-update" never does.
  applicationsSync: sync
  preserveResourcesOnDeletion: false
  prune: true
  # Allow windows for product syncs (empty = always). manualSync keeps break-glass possible.
  productSyncWindows: []

retry:
  limit: 10
  backoff: { duration: 30s, factor: 2, maxDuration: 10m }

mesh:
  jwt:
    issuer: https://auth.platform.example
    jwksUri: https://auth.platform.example/.well-known/jwks.json

# Platform add-ons, installed on every cluster of the group (sync-wave order).
addons:
  - name: cert-manager
    namespace: cert-manager
    wave: -30
    chart: { repoURL: https://charts.jetstack.io, name: cert-manager, version: v1.21.2 }
    values:
      crds: { enabled: true }
      replicaCount: 2
      podDisruptionBudget: { enabled: true }
  - name: argo-rollouts
    namespace: argo-rollouts
    wave: -30
    chart: { repoURL: https://argoproj.github.io/argo-helm, name: argo-rollouts, version: 2.43.9 }
    values:
      controller: { replicas: 2 }
      dashboard: { enabled: false }
  - name: falco
    namespace: falco
    wave: -20
    chart: { repoURL: https://falcosecurity.github.io/charts, name: falco, version: 9.2.0 }
    values:
      driver: { kind: modern_ebpf }
      tty: true
      # Findings go to Cloud Logging (JSON on stdout) -> log-based alerts and the SCC pipeline
      # (docs/security-operations.md).
      falco:
        json_output: true
        priority: notice
      falcosidekick: { enabled: false }
      customRules:
        platform-rules.yaml: |-
          - macro: in_tenant_namespace
            condition: (k8s.ns.labels.customer exists and k8s.ns.labels.customer != "shared")
          - rule: Shell in a tenant container
            desc: An interactive shell started in a customer workload (no exec is ever expected).
            condition: spawned_process and container and in_tenant_namespace and proc.name in (bash, sh, zsh, ash, dash) and proc.tty != 0
            output: "Shell in tenant container (ns=%k8s.ns.name pod=%k8s.pod.name cmd=%proc.cmdline user=%user.name)"
            priority: CRITICAL
            tags: [platform, tenant-isolation]
          - rule: Tenant egress bypassing the egress gateway
            desc: A tenant pod connects outside the cluster without going through the Istio egress gateway.
            condition: outbound and container and in_tenant_namespace and not proc.name in (pilot-agent, envoy, cloud-sql-proxy) and not fd.snet in ("10.0.0.0/8", "100.64.0.0/10", "169.254.169.254/32", "199.36.153.4/30")
            output: "Direct egress from tenant pod (ns=%k8s.ns.name pod=%k8s.pod.name dest=%fd.name)"
            priority: WARNING
            tags: [platform, egress]
          - rule: Write below binary directories in a tenant container
            desc: Tenant images run read-only; a write below /usr or /bin means tampering.
            condition: open_write and container and in_tenant_namespace and (fd.directory startswith /usr or fd.directory startswith /bin)
            output: "Binary directory write (ns=%k8s.ns.name pod=%k8s.pod.name file=%fd.name)"
            priority: CRITICAL
            tags: [platform, integrity]
  - name: mesh
    namespace: istio-system
    wave: -20
    path: argocd/addons/mesh          # ingress/egress gateways, mesh-wide mTLS, JWT at the edge
  - name: platform
    namespace: platform-system
    wave: -10
    path: argocd/addons/platform      # canary analysis template, label policy, metrics
