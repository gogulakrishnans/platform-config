# Canary analysis shared by every product Rollout (architecture §13): error rate and p95 latency
# of the canary Service from Istio metrics. Two failed measurements abort and roll back.
apiVersion: argoproj.io/v1alpha1
kind: ClusterAnalysisTemplate
metadata:
  name: istio-golden-signals
  labels:
    {{- include "platform.labels" . | nindent 4 }}
spec:
  args:
    - name: service
    - name: namespace
    - name: max-error-rate
    - name: max-p95-latency-ms
  metrics:
    - name: error-rate
      interval: 1m
      failureLimit: 1
      # No traffic yet (NaN) counts as success; the next measurement decides.
      successCondition: {{`"isNaN(result[0]) || result[0] <= {{args.max-error-rate}}"`}}
      provider:
        prometheus:
          address: http://gmp-frontend.platform-system.svc.cluster.local:9090
          query: |
            {{`sum(rate(istio_requests_total{reporter="destination",destination_service_name="{{args.service}}-canary",destination_service_namespace="{{args.namespace}}",response_code=~"5.."}[2m]))
            /
            sum(rate(istio_requests_total{reporter="destination",destination_service_name="{{args.service}}-canary",destination_service_namespace="{{args.namespace}}"}[2m]))`}}
    - name: p95-latency
      interval: 1m
      failureLimit: 1
      successCondition: {{`"isNaN(result[0]) || result[0] <= {{args.max-p95-latency-ms}}"`}}
      provider:
        prometheus:
          address: http://gmp-frontend.platform-system.svc.cluster.local:9090
          query: |
            {{`histogram_quantile(0.95, sum by (le) (rate(istio_request_duration_milliseconds_bucket{reporter="destination",destination_service_name="{{args.service}}-canary",destination_service_namespace="{{args.namespace}}"}[2m])))`}}
