  labels:
    customer: shared
    environment: shared
    env-group: devstage
    product: platform
    region-role: primary
    managed-by: argocd
  namespace: argocd-devstage
spec:
  project: platform-addons
  source:
    repoURL: https://falcosecurity.github.io/charts
    chart: falco
    targetRevision: 9.2.0
    helm:
      releaseName: falco
      valuesObject:
        customRules:
          platform-rules.yaml: "- macro: in_tenant_namespace\n  condition: (k8s.ns.labels.customer\
            \ exists and k8s.ns.labels.customer != \"shared\")\n- rule: Shell in a\
            \ tenant container\n  desc: An interactive shell started in a customer\
            \ workload (no exec is ever expected).\n  condition: spawned_process and\
            \ container and in_tenant_namespace and proc.name in (bash, sh, zsh, ash,\
            \ dash) and proc.tty != 0\n  output: \"Shell in tenant container (ns=%k8s.ns.name\
            \ pod=%k8s.pod.name cmd=%proc.cmdline user=%user.name)\"\n  priority:\
            \ CRITICAL\n  tags: [platform, tenant-isolation]\n- rule: Tenant egress\
            \ bypassing the egress gateway\n  desc: A tenant pod connects outside\
            \ the cluster without going through the Istio egress gateway.\n  condition:\
            \ outbound and container and in_tenant_namespace and not proc.name in\
            \ (pilot-agent, envoy, cloud-sql-proxy) and not fd.snet in (\"10.0.0.0/8\"\
            , \"100.64.0.0/10\", \"169.254.169.254/32\", \"199.36.153.4/30\")\n  output:\
            \ \"Direct egress from tenant pod (ns=%k8s.ns.name pod=%k8s.pod.name dest=%fd.name)\"\
            \n  priority: WARNING\n  tags: [platform, egress]\n- rule: Write below\
            \ binary directories in a tenant container\n  desc: Tenant images run\
            \ read-only; a write below /usr or /bin means tampering.\n  condition:\
            \ open_write and container and in_tenant_namespace and (fd.directory startswith\
            \ /usr or fd.directory startswith /bin)\n  output: \"Binary directory\
            \ write (ns=%k8s.ns.name pod=%k8s.pod.name file=%fd.name)\"\n  priority:\
            \ CRITICAL\n  tags: [platform, integrity]"
        driver:
          kind: modern_ebpf
        falco:
          json_output: true
          priority: notice
        falcosidekick:
          enabled: false
        tty: true
  destination:
    server: https://devstage-us-east1-02.us-east1.gke.goog.example
    namespace: falco
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - ServerSideApply=true
    - PruneLast=true
    - RespectIgnoreDifferences=true
    - CreateNamespace=true
    retry:
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
      limit: 10
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devstage-us-east1-02-mesh
  labels:
    customer: shared
    environment: shared
    env-group: devstage
    product: platform
    region-role: primary
    managed-by: argocd
  namespace: argocd-devstage
spec:
  project: platform-addons
  source:
    repoURL: https://github.com/example-org/platform-config.git
    targetRevision: main
    path: argocd/addons/mesh
    helm:
      releaseName: mesh
      parameters:
      - name: cluster
        value: devstage-us-east1-02
      - name: region
        value: us-east1
      - name: regionRole
        value: primary
      valuesObject:
        group: devstage
        computeProject: pfx-compute-devstage
        gatewayHosts:
        - '*.dev.platform.internal'
        - '*.stage.platform.internal'
        egressHosts:
        - api.stripe.example:443
        jwt:
          issuer: https://auth.platform.example
          jwksUri: https://auth.platform.example/.well-known/jwks.json
  destination:
    server: https://devstage-us-east1-02.us-east1.gke.goog.example
    namespace: istio-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - ServerSideApply=true
    - PruneLast=true
    - RespectIgnoreDifferences=true
    - CreateNamespace=true
    retry:
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
      limit: 10
---
