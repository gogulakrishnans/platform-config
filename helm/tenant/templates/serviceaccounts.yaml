{{- $ns := include "tenant.namespace" . -}}
{{- range .Values.serviceAccounts }}
---
# KSA for one product. Its Workload Identity principal is granted the product's own data
# containers by L3; it impersonates the env GSA for the Cloud SQL IAM login.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .name }}
  namespace: {{ $ns }}
  labels:
    {{- include "tenant.labelsFor" (dict "Values" $.Values "Chart" $.Chart "product" .name) | nindent 4 }}
  annotations:
    iam.gke.io/gcp-service-account: {{ .gsa }}
automountServiceAccountToken: false
{{- end }}
