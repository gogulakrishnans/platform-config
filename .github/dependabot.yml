# Keeps the SHA-pinned actions, the Python tooling and the db-bootstrap image current.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: pip
    directories: [/, /db-bootstrap, /data-flows/seed-down]
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /db-bootstrap
    schedule: { interval: weekly }
  - package-ecosystem: terraform
    directories: [/infrastructure/modules/*, /infrastructure/layers/L1-foundation]
    schedule: { interval: monthly }
