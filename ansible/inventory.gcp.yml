---
# Dynamic inventory for the Ansible runner pool (private IPs only, same VPC as the MIGs). Instances
# are grouped by the mandatory labels, so a run can target one customer, product and environment.
plugin: google.cloud.gcp_compute
projects:
  - pfx-compute-devstage
  - pfx-compute-uat
  - pfx-compute-prod
auth_kind: application
filters:
  - labels.product = billing
hostnames:
  - private_ip
keyed_groups:
  - key: labels.customer
    prefix: customer
  - key: labels.environment
    prefix: env
groups:
  legacy_billing: "'billing' == labels.product"
compose:
  ansible_host: networkInterfaces[0].networkIP
